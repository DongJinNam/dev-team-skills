name: Adoption report
description: Report how you adopted dev-team-skills, what worked, and what did not.
title: "[adoption] "
labels: ["adoption"]
body:
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Codex
        - Antigravity
        - Cursor
        - Other
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: How did you install it?
      description: The exact path you followed (marketplace install, setup script, manual copy) and the commit or version.
      placeholder: |
        Install path: ...
        Commit/version: ...
    validations:
      required: true
  - type: textarea
    id: used
    attributes:
      label: What did you use?
      description: Which skills you invoked, on what kind of task, and what came out.
      placeholder: engineering-squad on a feature PR; code-review on...
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What got in the way?
      description: Anything unclear, slow, broken, or missing. Include the exact error or behavior.
      placeholder: The first run failed because...
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Did the result improve anything measurable (time, tokens, review findings)? State the numbers and the conditions, or say it was not measured.
      placeholder: Not measured / 3 tasks, same model, ...
    validations:
      required: false
