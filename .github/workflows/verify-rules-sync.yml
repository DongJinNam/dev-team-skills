name: Verify Rules and Harness Synchronization

on:
  push:
    branches: [ main, feature/**, fix/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-sync-and-harness:
    name: Package validation (${{ matrix.os }}, ${{ matrix.launcher }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        launcher: [bash, pwsh]
    runs-on: ${{ matrix.os }}
    env:
      HARNESS_LAUNCHER: ${{ matrix.launcher }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package validation dependency
        run: python -m pip install -r scripts/requirements-harness.txt

      - name: Run shared normal and error cases through Bash
        if: matrix.launcher == 'bash'
        shell: bash
        run: |
          # Native Windows subprocess lookup can select WSL's bash.exe.
          # Pass the exact Git Bash executable that Actions is running.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export HARNESS_BASH="$(cygpath -w "$BASH")"
          else
            export HARNESS_BASH="$BASH"
          fi
          python -m unittest discover -s tests -v

      - name: Run shared normal and error cases through PowerShell
        if: matrix.launcher == 'pwsh'
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Verify repository through Bash
        if: matrix.launcher == 'bash'
        shell: bash
        run: bash scripts/verify-harness.sh

      - name: Verify repository through PowerShell
        if: matrix.launcher == 'pwsh'
        shell: pwsh
        run: ./scripts/verify-harness.ps1

      - name: Replay recorded agent decisions through Bash (not a fresh model run)
        if: matrix.launcher == 'bash'
        shell: bash
        run: bash evals/run-evals.sh --replay evals/runs/2026-11-04-tiered-decisions.json

      - name: Replay recorded agent decisions through PowerShell (not a fresh model run)
        if: matrix.launcher == 'pwsh'
        shell: pwsh
        run: ./evals/run-evals.ps1 --replay evals/runs/2026-11-04-tiered-decisions.json
