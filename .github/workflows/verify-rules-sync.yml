name: Verify Rules and Harness Synchronization

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  check-sync-and-harness:
    name: Check Rules, Skills, and Marketplace Harness Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Verification Harness Script
        run: |
          chmod +x scripts/verify-harness.sh
          ./scripts/verify-harness.sh
